# Phase 1 smoke-test endpoint — proves the whole path (DNS → tunnel → Traefik
# Gateway → HTTPRoute → Service → pod). Served on whoami.hero-rehab.xyz.
# Image pinned (never :latest). No affinity — timestone nodes carry no
# workload-type label (home template minus nodeAffinity/scaledobject).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami
  labels:
    app: whoami
spec:
  revisionHistoryLimit: 3
  replicas: 1
  selector:
    matchLabels:
      app: whoami
  template:
    metadata:
      labels:
        app: whoami
    spec:
      # NOTE: traefik/whoami runs as root — no runAsNonRoot on pod or container.
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: whoami
          image: traefik/whoami:v1.10.4
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 1
            periodSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 1
            periodSeconds: 5
            failureThreshold: 3
