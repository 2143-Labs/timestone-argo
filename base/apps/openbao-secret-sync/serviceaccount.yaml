# The identity holder for the OpenBao secret sync.
#
# This ServiceAccount is what the ClusterSPIFFEID matches on, so its name is
# load-bearing: the rendered SPIFFE ID is
#   spiffe://trust.hero-rehab.xyz/ns/default/sa/openbao-secret-sync
# and the OpenBao role's bound_subject must be byte-identical to that string.
# Renaming this ServiceAccount breaks the login, not just the RBAC.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-secret-sync
  namespace: default
