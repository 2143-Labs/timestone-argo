# Public hostname for the ranked service. Lives with the wave-5 `umvc3`
# Application (not the wave-4 gateway app): GatewayAPI needs the backend
# Service to exist before the route can resolve — the backend Deployment is
# created in the same wave, avoiding a cross-wave circular dependency.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: umvc3
  namespace: default
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: timestone-gateway
  hostnames:
    - "umvc3-ranked.hero-rehab.xyz"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: umvc3
          port: 80
          weight: 1