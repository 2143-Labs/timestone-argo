# Pocket-ID SSO IdP — public identity server at id.hero-rehab.xyz. It is the
# OIDC issuer for cluster access. Adapted from argo/workloads/pocket-id:
# APP_URL -> id.hero-rehab.xyz, and the optional MaxMind GeoLite entries
# dropped (no license key).
#
# No auth gate: the IdP must be reachable anonymously for anyone to log in
# (same precedent as whoami). First-run setup creates the admin account;
# PocketID's signup mode defaults to Disabled, so this is not open
# self-registration.
#
# ANALYTICS_DISABLED is true. With it false, pocket-id POSTs a heartbeat to
# https://analytics.pocket-id.org containing an instance UUID, first-seen and
# last-seen timestamps, and the version. That host resolves to Cloudflare
# addresses (172.67.210.10 / 104.21.50.197), so the flow would satisfy a
# literal "egress only to Cloudflare" rule while still being the one outbound
# third-party data flow in this cluster that nothing justifies. VERSION_CHECK
# was already disabled; this is the same class of call.
#
# There is no config-reloader in this cluster and the Deployment carries no
# configmap checksum annotation, so editing this file does NOT restart the pod.
# Roll the Deployment after the configmap lands, or the old value stays live.
apiVersion: v1
kind: ConfigMap
metadata:
  name: pocket-id
  namespace: default
data:
  ANALYTICS_DISABLED: "true"
  APP_URL: https://id.hero-rehab.xyz
  AUDIT_LOG_RETENTION_DAYS: "90"
  DISABLE_RATE_LIMITING: "true"
  FILE_BACKEND: filesystem
  HOST: 0.0.0.0
  INTERNAL_APP_URL: ""
  LOCAL_IPV6_RANGES: ""
  LOG_JSON: "false"
  LOG_LEVEL: info
  METRICS_ENABLED: "false"
  PORT: "1411"
  TRACING_ENABLED: "false"
  TRUST_PROXY: "true"
  TZ: Etc/UTC
  UI_CONFIG_DISABLED: "false"
  UPLOAD_PATH: data/uploads
  VERSION_CHECK_DISABLED: "true"
