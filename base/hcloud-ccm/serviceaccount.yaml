# hcloud-cloud-controller-manager — vendored from the chart's rendered output.
# Static manifests (not the helm chart): ArgoCD's bundled helm 4.2.1 renders
# the chart's deployment.yaml with a YAML parse error (helm v4.2.1 regression
# triggered by ArgoCD's --api-versions list). Image pinned to the chart 1.36.0
# app version (talos/versions.json charts.hcloud-cloud-controller-manager).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hcloud-cloud-controller-manager
  namespace: kube-system
