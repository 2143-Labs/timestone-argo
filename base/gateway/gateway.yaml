# The single routing source. Gateway + all HTTPRoutes live in ns `default`;
# same-namespace attachment is declared explicitly because the Gateway API
# defaulting (from: Same) otherwise re-appears and drifts ArgoCD OutOfSync.
# Plain HTTP :80 only — TLS terminates at the Cloudflare edge, so no cert refs.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: timestone-gateway
  namespace: default
spec:
  gatewayClassName: traefik
  listeners:
    - name: http
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
