# HTTPRoutes behind the timestone-gateway (ns default, same-namespace attach).
# Written in the FULL Gateway-API applied shape (group/kind/weight, default
# PathPrefix match) so the API defaulting doesn't re-introduce drift.
#
# TWO-LAYER EXPOSURE MODEL:
#   PUBLIC  — plain hero-rehab.xyz hostnames listed in the cloudflared tunnel
#             ingress allowlist (whoami below).
#   PRIVATE — *.int.hero-rehab.xyz hostnames: reachable only after Cloudflare
#             Zero Trust Access authentication (Access app is in the tofu repo).
#             Temporal's web UI lives here for operators; WORKLOADS do not use
#             HTTP at all — they use temporal-frontend.default.svc:7233 (gRPC)
#             in-cluster.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: whoami
  namespace: default
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: timestone-gateway
      weight: 1
  hostnames:
    - "whoami.hero-rehab.xyz"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: whoami
          port: 80
          weight: 1
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: temporal-int
  namespace: default
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: timestone-gateway
      weight: 1
  hostnames:
    - "temporal.int.hero-rehab.xyz"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: temporal-web
          port: 8080
          weight: 1
