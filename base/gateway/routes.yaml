# HTTPRoutes behind the timestone-gateway (ns default, same-namespace attach).
# Shape notes: parentRefs carries only group/kind/name (there is NO weight on
# parentRefs — that is backendRefs-only); rules include the defaulted PathPrefix
# match. Written to match the Gateway API's applied shape so ArgoCD doesn't drift.
#
# EXPOSURE MODEL — internal services stay INTERNAL:
#   PUBLIC  — only the hostnames listed in the cloudflared tunnel ingress
#             allowlist get a route here (whoami, the smoke test; pocket-id).
#   INTERNAL — everything else is ClusterIP-only and reached in-cluster by
#             service DNS (e.g. Temporal workloads → temporal-frontend:7233 gRPC)
#             or by `kubectl port-forward` for operators.
#   If a service ever needs browser access from outside, it gets a route ONLY
#   together with an auth gate: oauth2-proxy (--provider=oidc, as in the home
#   argo repo) in front of it, and the hostname added to the tunnel allowlist.
#   No gate ⇒ no route. Two ungated exceptions exist, each because a gate would
#   be circular or unusable, and each commented as such at the route itself:
#   the SPIRE OIDC/JWKS endpoint (public key material, fetched machine-to-machine
#   — argocd/wave-4/spire-route.yaml) and the Pocket-ID IdP below (gating the
#   IdP behind the IdP would make it impossible to log in).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: whoami
  namespace: default
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: timestone-gateway
  hostnames:
    - "whoami.hero-rehab.xyz"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: whoami
          port: 80
          weight: 1

---
# Pocket-ID SSO IdP — public login at id.hero-rehab.xyz. This is
# the OIDC issuer; it intentionally has no auth gate (same precedent as whoami:
# the IdP itself must be reachable anonymously).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pocket-id
  namespace: default
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: timestone-gateway
  hostnames:
    - "id.hero-rehab.xyz"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: pocket-id
          port: 80
          weight: 1
