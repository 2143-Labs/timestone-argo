# HTTPRoutes behind the timestone-gateway (ns default, same-namespace attach).
# BackendRefs verified against home-argo production:
#   temporal-web:8080 — temporal chart web UI Service (fullnameOverride temporal)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: whoami
  namespace: default
spec:
  parentRefs:
    - name: timestone-gateway
  hostnames:
    - "whoami.c.hero.rehab"
  rules:
    - backendRefs:
        - name: whoami
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: temporal
  namespace: default
spec:
  parentRefs:
    - name: timestone-gateway
  hostnames:
    - "temporal.c.hero.rehab"
  rules:
    - backendRefs:
        - name: temporal-web
          port: 8080
