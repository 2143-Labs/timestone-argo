# HTTPRoutes behind the timestone-gateway (ns default, same-namespace attach).
# Written in the FULL Gateway-API applied shape (group/kind/weight, default
# PathPrefix match) so the API defaulting doesn't re-introduce drift.
#
# SECURITY: only intentionally-public services get a route here. Temporal is an
# INTERNAL service — workloads reach it in-cluster at
# `temporal-frontend.default.svc.cluster.local:7233` (gRPC); there is
# deliberately NO external HTTPRoute for it.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: whoami
  namespace: default
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: timestone-gateway
      weight: 1
  hostnames:
    - "whoami.hero-rehab.xyz"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: whoami
          port: 80
          weight: 1
