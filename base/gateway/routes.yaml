# HTTPRoutes behind the timestone-gateway (ns default, same-namespace attach).
# Written in the FULL Gateway-API applied shape (group/kind/weight, default
# PathPrefix match) so the API defaulting doesn't re-introduce drift.
# BackendRefs verified against home-argo production:
#   temporal-web:8080 — temporal chart web UI Service (fullnameOverride temporal)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: whoami
  namespace: default
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: timestone-gateway
      weight: 1
  hostnames:
    - "whoami.hero-rehab.xyz"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: whoami
          port: 80
          weight: 1
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: temporal
  namespace: default
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: timestone-gateway
      weight: 1
  hostnames:
    - "temporal.hero-rehab.xyz"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: temporal-web
          port: 8080
          weight: 1
