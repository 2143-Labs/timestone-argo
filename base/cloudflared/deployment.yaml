# Named-tunnel connector pods. Token comes from the `cloudflared-tunnel-token`
# Secret in ns default (key `token`), fetched from the Cloudflare API and
# created imperatively at bootstrap — NOT defined in this repo. Token mode
# replaces the legacy credentials-file style used on the old k3s cluster.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  labels:
    app: cloudflared
spec:
  revisionHistoryLimit: 3
  replicas: 2
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
      annotations:
        # Bump when cloudflared-config changes: ConfigMap edits alone do not
        # restart the pods, and the tunnel config is read at startup only.
        timestone.io/config-revision: "4"
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.8.3 # pinned — never :latest
          imagePullPolicy: IfNotPresent
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflared-tunnel-token
                  key: token
          args:
            - tunnel
            - --config
            - /etc/cloudflared/config.yml
            - --no-autoupdate
            - run
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /etc/cloudflared/
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: cloudflared-config
