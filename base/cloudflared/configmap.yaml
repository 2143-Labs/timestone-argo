# Tunnel routing config. `tunnel` id comes from
# `tofu -chdir=cloudflare output tunnel_id` (API-created named tunnel). The
# credentials Secret (`cloudflared-credentials`, ns default) is created by the
# k8s-secrets-bootstrap oneshot from an age file — NOT defined in this repo.
#
# TWO-LAYER EXPOSURE MODEL (explicit allowlist, never a bare public wildcard):
#   PUBLIC  — whoami.hero-rehab.xyz → Traefik (no auth).
#   PRIVATE — *.int.hero-rehab.xyz → Traefik, but ONLY after Cloudflare Zero
#             Trust Access authentication. This requires the Access application
#             (`Timestone internal`, tofu/cloudflare/main.tf) to exist FIRST —
#             do not add the int hostname here until it does, or the private
#             layer would be open to the internet.
#   Everything else → 404 at the tunnel.
# Adding a service = add its hostname here (+ an HTTPRoute), via GitOps.
# NOTE: bump `timestone.io/config-revision` in deployment.yaml when this changes.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-config
  namespace: default
data:
  config.yml: |
    tunnel: 1e6bb9a4-8a99-4eaa-a029-105155bdeccd
    credentials-file: /etc/cloudflared/creds.json
    ingress:
      - hostname: whoami.hero-rehab.xyz
        service: http://traefik.traefik.svc:80
      - service: http_status:404
