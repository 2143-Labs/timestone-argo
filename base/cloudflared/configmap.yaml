# Tunnel routing config. `tunnel` id comes from
# `tofu -chdir=cloudflare output tunnel_id` (API-created named tunnel). Auth
# uses TUNNEL_TOKEN (Secret `cloudflared-tunnel-token`, ns default) — no
# credentials file in token mode.
#   PUBLIC  — whoami.hero-rehab.xyz → Traefik (no auth).
#   PRIVATE — *.int.hero-rehab.xyz → Traefik, but ONLY after Cloudflare Zero
#             Trust Access authentication. This requires the Access application
#             (`Timestone internal`, tofu/cloudflare/main.tf) to exist FIRST —
#             do not add the int hostname here until it does, or the private
#             layer would be open to the internet.
#   Everything else → 404 at the tunnel.
# Adding a service = add its hostname here (+ an HTTPRoute), via GitOps.
# NOTE: bump `timestone.io/config-revision` in deployment.yaml when this changes.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-config
  namespace: default
data:
  config.yml: |
    tunnel: 1e6bb9a4-8a99-4eaa-a029-105155bdeccd
    ingress:
      - hostname: whoami.hero-rehab.xyz
        service: http://traefik.traefik.svc:80
      # SPIFFE OIDC discovery + JWKS for the timestone SPIRE server. This route
      # is deliberately UNGATED — the discovery document and JWKS are public
      # key material, and the consumer is the home OpenBao fetching them
      # machine-to-machine with no browser session to present. Do not add an
      # oauth2-proxy gate here; it would break OpenBao's JWT auth. The SPIRE
      # bundle endpoint is NOT exposed here (see argocd/wave-3/spire.yaml).
      - hostname: spiffe.hero-rehab.xyz
        service: http://traefik.traefik.svc:80
      - service: http_status:404
