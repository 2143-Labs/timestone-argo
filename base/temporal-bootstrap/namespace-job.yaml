apiVersion: batch/v1
kind: Job
metadata:
  name: temporal-namespace-timestone
  # Managed (not a Sync hook): hooks are excluded from an Application's managed
  # resources, so a hook-only app always compares as Synced and auto-sync never
  # runs — the namespace was never created. As a managed Job the app is
  # OutOfSync whenever this Job is absent or its spec changed, so the script
  # runs on a fresh cluster and selfHeal re-runs it if the Job is deleted.
  # No ttlSecondsAfterFinished: deleting the Job after success would make the
  # app OutOfSync again and re-run the bootstrap on every reconcile. The script
  # is idempotent (describe → update-or-create → describe), so re-runs are safe.
  annotations:
    argocd.argoproj.io/sync-options: Force=true,Replace=true
spec:
  activeDeadlineSeconds: 300
  backoffLimit: 6
  template:
    metadata:
      labels:
        app: temporal-namespace-bootstrap
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: namespace
          image: temporalio/admin-tools:1.31.1
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ceu
            - |
              ADDRESS=temporal-frontend:7233
              NAMESPACE=timestone
              if temporal operator namespace describe --address "$ADDRESS" --namespace "$NAMESPACE"; then
                temporal operator namespace update --address "$ADDRESS" --namespace "$NAMESPACE" --retention 72h
              else
                temporal operator namespace create --address "$ADDRESS" --namespace "$NAMESPACE" --retention 72h
              fi
              temporal operator namespace describe --address "$ADDRESS" --namespace "$NAMESPACE"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
