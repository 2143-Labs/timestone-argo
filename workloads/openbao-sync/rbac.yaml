# The sync account writes one approved value to two narrowly-scoped Secrets.
# Creates cannot be restricted by resourceName, so each Role's create grant is
# namespace-scoped; get/update stay pinned and no list/watch/delete is granted.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openbao-secret-sync
  namespace: openbao-sync
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["openbao-steam"]
    verbs: ["get", "update"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openbao-secret-sync
  namespace: openbao-sync
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: openbao-secret-sync
subjects:
  - kind: ServiceAccount
    name: openbao-secret-sync
    namespace: openbao-sync
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openbao-secret-sync-umvc3
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["umvc3-runtime"]
    verbs: ["get", "update"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openbao-secret-sync-umvc3
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: openbao-secret-sync-umvc3
subjects:
  - kind: ServiceAccount
    name: openbao-secret-sync
    namespace: openbao-sync
