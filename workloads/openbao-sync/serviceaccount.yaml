# The identity holder for the OpenBao secret sync.
#
# This ServiceAccount is what the ClusterSPIFFEID matches on, so its name is
# load-bearing: the rendered SPIFFE ID is
#   spiffe://trust.hero-rehab.xyz/ns/openbao-sync/sa/openbao-secret-sync
# and the OpenBao role's bound_subject must be byte-identical to that string.
# Renaming this ServiceAccount, or moving it to another namespace, breaks the
# login — not just the RBAC.
#
# The namespace component matters as much as the name: see namespace.yaml for
# why this no longer lives in `default`.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-secret-sync
  namespace: openbao-sync
