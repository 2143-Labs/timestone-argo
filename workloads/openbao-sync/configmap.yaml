# spiffe-helper HCL config and the sync script, both mounted as files.
#
# HCL notes (these are exactly the keys spiffe-helper v0.11.0 parses, and every
# one of them is load-bearing):
#
#   agent_address  — the socket the SPIFFE CSI driver mounts into this pod. The
#                    helper's own default (/tmp/spire-agent/public/api.sock) is
#                    the *host* path used by a hostNetwork agent, and is not
#                    present here.
#   cert_dir       — REQUIRED. The written path is path.Join(CertDir,
#                    jwt_svid_file_name), and path.Join does not treat a leading
#                    "/" in the second argument as a reset — an absolute
#                    jwt_svid_file_name would land under CertDir, not at it. So
#                    cert_dir owns the directory and the filename stays relative.
#   jwt_svids      — jwt_audience and jwt_svid_file_name are both mandatory
#                    (ValidateConfig). The audience must equal the OpenBao
#                    role's bound_audiences exactly.
#   health_checks  — fields are listener_enabled / bind_port / liveness_path /
#                    readiness_path, and there is no bind_address: the helper
#                    always listens on all interfaces. Readiness reports false
#                    until an SVID has actually been written, which is precisely
#                    the signal worth probing.
#
# The helper writes the JWT-SVID as plain text; the sync script reads it verbatim.
apiVersion: v1
kind: ConfigMap
metadata:
  name: openbao-secret-sync
  namespace: openbao-sync
data:
  helper.conf: |
    agent_address      = "/spiffe-workload-api/spire-agent.sock"
    cert_dir           = "/spiffe"
    daemon_mode        = true
    jwt_svid_file_mode = 0640
    jwt_svids = [
      {
        jwt_audience       = "openbao.john2143.com"
        jwt_svid_file_name = "svid.jwt"
      }
    ]
    health_checks {
      listener_enabled = true
      bind_port        = 8081
      liveness_path    = "/live"
      readiness_path   = "/ready"
    }

  sync.sh: |
    #!/bin/sh
    # One hop: SPIFFE identity -> OpenBao login -> KV read -> Kubernetes Secret.
    # Deliberately has no `bao` and no `kubectl`: both sides are plain HTTPS and
    # the base images carry neither binary.
    set -u

    BAO_ADDR="https://openbao.john2143.com"
    SA_DIR=/var/run/secrets/kubernetes.io/serviceaccount
    K8S="https://kubernetes.default.svc"
    SVID_FILE=/spiffe/svid.jwt
    INTERVAL_SECONDS=300

    log() { echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) $*"; }

    write_secret() {
      SECRET_NS=$1
      SECRET_NAME=$2
      SECRET_KEY=$3
      SECRET_VALUE=$4
      SECRET_URL="$K8S/api/v1/namespaces/$SECRET_NS/secrets/$SECRET_NAME"
      COLLECTION_URL="$K8S/api/v1/namespaces/$SECRET_NS/secrets"
      TOKEN=$(cat "$SA_DIR/token")
      B64=$(printf '%s' "$SECRET_VALUE" | base64 | tr -d '\r\n')

      LOOKUP=$(curl -s --cacert "$SA_DIR/ca.crt" \
        -H "Authorization: Bearer $TOKEN" -w '\n%{http_code}' "$SECRET_URL")
      GET_CODE=$(printf '%s' "$LOOKUP" | tail -n1)
      EXISTING=$(printf '%s' "$LOOKUP" | sed '$d')
      case "$GET_CODE" in
        200)
          RESOURCE_VERSION=$(printf '%s' "$EXISTING" | sed -n 's/.*"resourceVersion":"\([^"]*\)".*/\1/p')
          if [ -z "$RESOURCE_VERSION" ]; then
            log "secret lookup returned no resourceVersion for $SECRET_NS/$SECRET_NAME"
            return 1
          fi
          METHOD=PUT
          URL=$SECRET_URL
          VERSION_FIELD=",\"resourceVersion\":\"$RESOURCE_VERSION\""
          ;;
        404)
          METHOD=POST
          URL=$COLLECTION_URL
          VERSION_FIELD=
          ;;
        *)
          log "secret lookup failed for $SECRET_NS/$SECRET_NAME (http $GET_CODE)"
          return 1
          ;;
      esac

      BODY="{\"apiVersion\":\"v1\",\"kind\":\"Secret\",\"metadata\":{\"name\":\"$SECRET_NAME\",\"namespace\":\"$SECRET_NS\"$VERSION_FIELD,\"labels\":{\"app.kubernetes.io/managed-by\":\"openbao-secret-sync\"}},\"type\":\"Opaque\",\"data\":{\"$SECRET_KEY\":\"$B64\"}}"
      CODE=$(curl -s -o /dev/null -w '%{http_code}' -X "$METHOD" \
        --cacert "$SA_DIR/ca.crt" \
        -H "Authorization: Bearer $TOKEN" \
        -H 'Content-Type: application/json' \
        --data "$BODY" \
        "$URL")
      case "$CODE" in
        200|201)
          log "synced $SECRET_NS/$SECRET_NAME key $SECRET_KEY (http $CODE)"
          return 0
          ;;
        *)
          log "secret write failed for $SECRET_NS/$SECRET_NAME (http $CODE)"
          return 1
          ;;
      esac
    }

    sync_once() {
      if [ ! -s "$SVID_FILE" ]; then
        log "no JWT-SVID at $SVID_FILE yet"
        return 1
      fi

      # spiffe-helper writes the JWT-SVID as plain text: the file begins with the
      # JWT header `ey`. Base64-decoding it yielded a truncated string that
      # OpenBao rejected with HTTP 400, so it is read verbatim.
      SVID=$(tr -d '\r\n' < "$SVID_FILE")
      if [ -z "$SVID" ]; then
        log "could not read a JWT-SVID from $SVID_FILE"
        return 1
      fi

      # Retry transient DNS/transport failures inside a sync pass instead of
      # waiting five minutes. HTTP 4xx responses are not retried by curl.
      LOGIN=$(curl -s --retry 3 --retry-delay 2 --retry-connrefused \
        --connect-timeout 10 --max-time 30 -w '\n%{http_code}' \
        -X POST "$BAO_ADDR/v1/auth/jwt-timestone/login" \
        -H 'Content-Type: application/json' \
        --data "{\"role\":\"hello\",\"jwt\":\"$SVID\"}")
      CODE=$(printf '%s' "$LOGIN" | tail -n1)
      if [ "$CODE" != "200" ]; then
        log "OpenBao login failed (http $CODE)"
        return 1
      fi
      LOGIN=$(printf '%s' "$LOGIN" | sed '$d')

      TOKEN=$(printf '%s' "$LOGIN" | sed -n 's/.*"client_token":"\([^"]*\)".*/\1/p')
      if [ -z "$TOKEN" ]; then
        log "OpenBao login returned no client_token"
        return 1
      fi

      KV=$(curl -sf --retry 3 --retry-delay 2 --retry-connrefused \
        --connect-timeout 10 --max-time 30 -H "X-Vault-Token: $TOKEN" \
        "$BAO_ADDR/v1/consumers/data/hero-rehab/steam") || {
        log "OpenBao KV read failed"
        return 1
      }

      # Field-name agnostic on purpose: take the single value inside data.data
      # rather than assuming the key is literally "steam". KV v2 serialises
      # "data" before "metadata", so this match is deterministic.
      PAYLOAD=$(printf '%s' "$KV" | sed -n 's/.*"data":{"data":{\(.*\)},"metadata":.*/\1/p')
      VALUE=$(printf '%s' "$PAYLOAD" | sed -n 's/^"[^"]*":"\(.*\)"$/\1/p')
      if [ -z "$VALUE" ]; then
        log "could not extract a value from the KV response"
        return 1
      fi

      # The same approved Steam value is supplied to the isolated sync consumer
      # and to the ranked workload. A pass succeeds only when both destinations
      # have accepted the value; no credential is printed.
      FIRST_OK=true
      write_secret openbao-sync openbao-steam steam "$VALUE" || FIRST_OK=false
      SECOND_OK=true
      write_secret default umvc3-runtime STEAM_API_KEY "$VALUE" || SECOND_OK=false
      [ "$FIRST_OK" = true ] && [ "$SECOND_OK" = true ]
    }

    log "starting: every ${INTERVAL_SECONDS}s as spiffe://trust.hero-rehab.xyz/ns/openbao-sync/sa/openbao-secret-sync"
    while true; do
      sync_once || true
      sleep "$INTERVAL_SECONDS"
    done
