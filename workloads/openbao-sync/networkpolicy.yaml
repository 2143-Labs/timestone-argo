# Both directions are denied by default here.
#
# Neither pod in this namespace serves traffic — openbao-secret-sync only makes
# outbound calls, and hello-openbao's Service is a smoke test that is reached
# deliberately rather than by everything in the cluster. So the ingress half
# needs no allow rule: it is complete as written.
#
# Egress is denied too, with its allowlist in a separate CiliumNetworkPolicy
# (egress-cilium.yaml) because the permitted destinations include the
# node-local API server and a public FQDN, neither of which a plain
# NetworkPolicy can name. Those three rules are cluster DNS, the Kubernetes
# API, and openbao.john2143.com — the sync loop needs nothing else, since the
# SPIFFE Workload API is a UNIX socket rather than network traffic.
#
# Kubelet probes (spiffe-helper :8081 /live+/ready, hello-openbao :80) are
# unaffected by either policy: Cilium permits health-check traffic implicitly
# (enable-health-checking: true), which is why three other namespaces already
# run this same default-deny-ingress with probes and zero restarts.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: openbao-sync
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
  namespace: openbao-sync
spec:
  podSelector: {}
  policyTypes: ["Egress"]
