# Temporal's internal service mesh, plus its two known clients.
#
# Temporal is a multi-binary system: frontend/history/matching/worker each serve
# gRPC on their own port and additionally talk to each other on membership
# ports. All of them carry `app.kubernetes.io/name: temporal`, so a single
# selector covers the mesh. Ports are from the live CiliumIdentity named-port
# map:
#   frontend  rpc=7233 membership=6933 metrics=9090 http=7243
#   history   rpc=7234 membership=6934 metrics=9090
#   matching  rpc=7235 membership=6935 metrics=9090
#   worker    membership=6939 metrics=9090
#   web       http=8080
#
# Three clients are NOT temporal-labelled and would otherwise be blocked the
# moment the namespace-wide deny lands:
#   * umvc3    — base/apps/umvc3/deployment.yaml:90 TEMPORAL_ADDRESS=
#                http://temporal-frontend:7233 (gRPC to the frontend).
#   * the temporal-bootstrap Sync hook Job — base/temporal-bootstrap/
#                namespace-job.yaml:31 dials temporal-frontend:7233 and carries
#                the pod label `app: temporal-namespace-bootstrap`. It re-runs
#                on every sync (hook-delete-policy BeforeHookCreation), so it
#                must be allowed or every future sync fails at the hook.
#   * oauth2-proxy-temporal — the Temporal UI auth gate. It reverse-proxies
#                browser traffic to `temporal-web:8080`, which is the web
#                component's http port, not the frontend's gRPC port. This is
#                the ONLY path to that port: no route, and no other policy,
#                exposes temporal-web.
#
# `podSelector` without a `namespaceSelector` means "pods in this policy's own
# namespace", which is exactly the temporal mesh.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-temporal-mesh-and-clients
  namespace: default
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: temporal
  ingress:
    # The mesh itself.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: temporal
      ports:
        - protocol: TCP
          port: 7233
        - protocol: TCP
          port: 7234
        - protocol: TCP
          port: 7235
        - protocol: TCP
          port: 6933
        - protocol: TCP
          port: 6934
        - protocol: TCP
          port: 6935
        - protocol: TCP
          port: 6939
        - protocol: TCP
          port: 9090
        - protocol: TCP
          port: 7243
        - protocol: TCP
          port: 8080
    # umvc3 -> frontend.
    - from:
        - podSelector:
            matchLabels:
              app: umvc3
      ports:
        - protocol: TCP
          port: 7233
    # bootstrap hook Job -> frontend.
    - from:
        - podSelector:
            matchLabels:
              app: temporal-namespace-bootstrap
      ports:
        - protocol: TCP
          port: 7233
    # The Temporal UI auth gate -> the web component.
    #
    # Scoped by port rather than by component label on purpose: this policy's
    # own podSelector already covers every temporal pod, and only `web`
    # listens on 8080, so the port is what makes the rule narrow. A policy
    # that instead selected `app.kubernetes.io/component: web` as the target
    # would need a second NetworkPolicy object for the same flow.
    - from:
        - podSelector:
            matchLabels:
              app: oauth2-proxy-temporal
      ports:
        - protocol: TCP
          port: 8080
  policyTypes: ["Ingress"]
