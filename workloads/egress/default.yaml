            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: temporal
            io.kubernetes.pod.namespace: default
      toPorts:
        - ports:
            - port: "7233"
              protocol: TCP
---
