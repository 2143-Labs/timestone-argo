    # The persistence store (timestone-rw:5432).
    - toEndpoints:
        - matchLabels:
            cnpg.io/cluster: timestone
            io.kubernetes.pod.namespace: default
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
---
# The temporal namespace-bootstrap Job. It is transient (re-created on every
# sync by hook-delete-policy BeforeHookCreation), so it never shows up in
# steady-state inventories — but it MUST be allowed or every future Application
# sync fails at the operator hook.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-temporal-bootstrap-egress
  namespace: default
  annotations:
