      toPorts:
        - ports:
            - port: "7233"
              protocol: TCP
            - port: "7234"
              protocol: TCP
            - port: "7235"
              protocol: TCP
            - port: "6933"
              protocol: TCP
            - port: "6934"
              protocol: TCP
            - port: "6935"
              protocol: TCP
            - port: "6939"
              protocol: TCP
            - port: "9090"
              protocol: TCP
            - port: "7243"
              protocol: TCP
            - port: "8080"
