# Egress policy for `cnpg-system` (the CloudNativePG operator).
# ============================================================================
#
# SHAPE — every namespace file in `workloads/egress/` follows this exactly:
#
#   `default-deny-egress`  a Kubernetes NetworkPolicy with `podSelector: {}`
#                          and `policyTypes: ["Egress"]`. It selects every pod
#                          in the namespace and denies all egress.
#   `allow-*-egress`       one CiliumNetworkPolicy per workload, carrying the
#                          destinations that workload is justified in reaching.
#
# Why a Kubernetes NetworkPolicy for the deny rather than an empty-list
# CiliumNetworkPolicy: Cilium rejects a CNP whose rule list is empty
# ("rule must have at least one of Ingress, IngressDeny, Egress, EgressDeny"),
# so `egress: []` — the form the held Stage-4 draft used — is not just
# unenforced, it is INVALID, and the controller marks the policy Valid=False.
# A k8s NetworkPolicy with `policyTypes: ["Egress"]` and no rules is the one
# form that actually means "deny all egress". It is proven live by
# `openbao-sync`'s `default-deny-egress`: the sync workload still reaches
# OpenBao through its allow rules, and any other pod in that namespace times
# out on egress. Each allow policy is a CiliumNetworkPolicy because the
# destinations it names (FQDNs, reserved entities) cannot be expressed in the
# plain k8s NetworkPolicy API; Cilium unions the two model families, which is
# exactly how openbao-sync already works.
#
# Why the namespace-wide deny rather than a per-workload deny: a policy only
# applies to an endpoint once something *selects* it, so a deny scoped to
# today's pods leaves the next pod added to the namespace wide open. This is
# the trap the Stage-4 design exists to close. It also makes host-network
# questions moot — host-network pods are not Cilium endpoints, so a
# `podSelector: {}` NetworkPolicy never selects them.
#
# Each allow policy repeats the DNS and API rules rather than relying on
# `workloads/egress-prereqs/`. That is deliberate: it keeps every namespace
# independently revertible, and it keeps the failure mode local. Without the
# DNS rule in particular the `toFQDNs` rules would match nothing (Cilium only
# learns FQDN->IP from observed DNS answers, and only when an L7 `rules.dns`
# block puts the DNS proxy in the path) — so a policy that "allows
# github.com" would silently allow nothing at all.
#
# `rules.dns.matchPattern: "*"` is used rather than a narrow pattern because
# this cluster sets `tofqdns-dns-reject-response-code: refused`; musl/Alpine
# clients abandon a name once the `<name>.<ns>.svc.cluster.local` search-list
# variant is refused. See the plan for that residual trade-off.
# ============================================================================
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-cnpg-operator-egress
  namespace: cnpg-system
  annotations:
    # Allows land before the deny: Argo orders resources within one sync by
    # this annotation, so there is no window where the deny exists alone.
    argocd.argoproj.io/sync-wave: "5"
spec:
  endpointSelector:
    matchLabels:
      # Verified live: the operator pod carries both `app.kubernetes.io/name:
      # cloudnative-pg` and `app.kubernetes.io/instance: cnpg-operator`.
      app.kubernetes.io/name: cloudnative-pg
  egress:
    # 1. Cluster DNS, via the L7 DNS proxy so FQDN->IP is recorded.
    - toEndpoints:
        - matchLabels:
            k8s-app: kube-dns
            io.kubernetes.pod.namespace: kube-system
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    # 2. The Kubernetes API. The operator is a controller: without this it
    #    stops reconciling and the clusters silently drift out of management.
    #    Port-scoped to the API server, which is a hostNetwork static pod and
    #    so presents as one of these three reserved identities.
    - toEntities:
        - kube-apiserver
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "6443"
              protocol: TCP
    # 3. The managed PostgreSQL instances.
    #
    #    NOT optional. The operator drives every instance over the network:
    #    5432 (SQL), 8000 (instance-manager API, used for switchover and
    #    promotion) and 9187 (metrics/replication). Omitting this lets the deny
    #    land and then silently breaks reconciliation -- the clusters stay
    #    Running while nothing can manage them, which is the failure mode
    #    hardest to notice. The mirror-image ingress allow already exists in
    #    `workloads/east-west/allow-to-cnpg.yaml`, which also proves the
    #    operator-->instance direction exists.
    #
    #    Both clusters carry `app.kubernetes.io/name: postgresql`, so they are
    #    separated by `cnpg.io/cluster` (labels confirmed from the live pods).
    #    Two plain `matchLabels` entries are used instead of one
    #    `matchExpressions` entry on purpose: plain labels are the shape proven
    #    to translate, and a selector Cilium cannot express produces a silently
    #    inert policy.
    - toEndpoints:
        - matchLabels:
            cnpg.io/cluster: timestone
            io.kubernetes.pod.namespace: default
        - matchLabels:
            cnpg.io/cluster: umvc3-db
            io.kubernetes.pod.namespace: default
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
            - port: "8000"
              protocol: TCP
            - port: "9187"
              protocol: TCP
---
# The namespace-wide egress default-deny, expressed as a Kubernetes
# NetworkPolicy — the only form Cilium will accept for a bare deny (see the
# header comment). Argo orders resources within the Application by sync-wave,
# so this deny lands after the allows above.
#
# The ingress side of this namespace is handled separately by
# `workloads/egress-prereqs/required-allows.yaml`
# (`allow-apiserver-to-cnpg-webhook` on 9443 from the API-server entities),
# which the cluster-wide Stage-4 deny makes mandatory: all nine CNPG admission
# webhooks are `failurePolicy: Fail`.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
  namespace: cnpg-system
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  podSelector: {}
  policyTypes: ["Egress"]