# Egress policy for `argocd` (the GitOps control plane itself).
# ============================================================================
# Same shape as every file in `workloads/egress/`: a namespace-wide k8s
# NetworkPolicy `default-deny-egress` plus one CiliumNetworkPolicy allow per
# component. See the header comment in `workloads/egress/cnpg-system.yaml`.
#
# This is the highest-stakes namespace in the change after the tunnel: break
# Argo CD and you lose GitOps for everything. The component allows are derived
# from the INGRESS side of the existing in-namespace NetworkPolicies, which
# enumerate who may connect to whom and were the work of earlier stages:
#
#   argocd-server              -> redis 6379, repo-server 8081, dex 5556/5557
#   argocd-application-controller -> redis 6379, repo-server 8081
#   argocd-applicationset-controller -> repo-server 8081
#   argocd-notifications-controller -> repo-server 8081
#   argocd-repo-server         -> redis 6379  (+ internet git/helm remotes)
#
# The API rule is present for every component EXCEPT repo-server, which runs
# with automountServiceAccountToken: false (verified live) and therefore has no
# token to present; it instead needs 443 to its git and Helm remotes. The remotes
# are FQDN rules (Cilium only learns FQDN->IP from DNS answers observed behind
# an L7 rule, which is why each allow carries the cluster-DNS rule) with pinned
# toPorts -- never a bare toFQDNs, which would open every port to those hosts.
#
# Signals: the Argo Applications themselves are the health check -- if a sync
# ever stops, the first suspects are the rules below.
# ============================================================================
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-argocd-server-egress
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: argocd-server
      io.kubernetes.pod.namespace: argocd
  egress:
    - toEndpoints:
        - matchLabels:
            k8s-app: kube-dns
            io.kubernetes.pod.namespace: kube-system
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    - toEntities:
        - kube-apiserver
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "6443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: argocd-redis
            io.kubernetes.pod.namespace: argocd
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: argocd-repo-server
            io.kubernetes.pod.namespace: argocd
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: argocd-dex-server
            io.kubernetes.pod.namespace: argocd
      toPorts:
        - ports:
            - port: "5556"
              protocol: TCP
            - port: "5557"
              protocol: TCP
---
