---
# repo-server has NO API rule (automountServiceAccountToken: false, verified
# live) and no service token -- its egress is the git/Helm remotes over 443.
# The FQDN list is exhaustive and pinned by toPorts; a bare toFQDNs would open
# every port and protocol to those hosts.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-argocd-repo-server-egress
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: argocd-repo-server
      io.kubernetes.pod.namespace: argocd
  egress:
    - toEndpoints:
        - matchLabels:
            k8s-app: kube-dns
            io.kubernetes.pod.namespace: kube-system
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: argocd-redis
            io.kubernetes.pod.namespace: argocd
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
    # Internet git/Helm remotes. FQDN rules are L4+ (FQDN list + toPorts), and
    # every one carries the port pin.
    - toFQDNs:
        - matchName: github.com
        - matchName: helm.cilium.io
        - matchName: charts.hetzner.cloud
        - matchName: spiffe.github.io
        - matchName: cloudnative-pg.github.io
        - matchName: go.temporal.io
        - matchName: helm.traefik.io
        - matchName: traefik.github.io
        # The observability stack's chart sources (waves 10-13).
        #
        # These are separate HOSTS, not paths under github.com: GitHub Pages
        # serves each organisation from its own `<org>.github.io` hostname, so
        # `github.com` being allowed does not cover them. The failure mode is
        # worth naming because it does not look like a policy problem: the
        # repo-server's fetch hangs until Argo's own deadline, and the
        # Application reports
        #   "failed to generate manifest ... code = DeadlineExceeded"
        # while every other Application stays Healthy. That reads as an Argo
        # fault, not as a missing egress rule.
        #
        #   prometheus-community.github.io   kube-prometheus-stack (wave 10)
        #   grafana-community.github.io      loki (wave 12), grafana (wave 13)
        #   grafana.github.io                alloy (wave 12)
        #
        # kube-prometheus-stack also declares its subcharts as OCI dependencies
        # under ghcr.io, but its published archive BUNDLES those subcharts in
        # `charts/`, and Argo does not run `helm dependency update` — it
        # templates the archive as fetched. ghcr.io is therefore deliberately
        # absent.
        - matchName: prometheus-community.github.io
        - matchName: grafana-community.github.io
        - matchName: grafana.github.io
        # GitHub release assets, where a Helm chart tarball ACTUALLY comes
        # from. This is not a path under github.com: a chart index on a Pages
        # host publishes urls of the form
        #   https://github.com/<org>/<repo>/releases/download/<tag>/<chart>.tgz
        # and GitHub answers that with a redirect to release-assets
        # .githubusercontent.com (185.199.10x.133). Both the chart repos this
        # unit uses publish that way, verified from their live index.yaml:
        # prometheus-community/helm-charts and spiffe/helm-charts-hardened.
        #
        # Omitting it does not produce a 403 or a DNS error. The SYN to the
        # redirect target is dropped, so `helm pull` hangs until Argo's own
        # 90-second deadline and the Application reports DeadlineExceeded while
        # every other Application stays Healthy. That is what made `spire` and
        # `spire-crds` sit at Sync Unknown at the start of this work: GitHub
        # serves release assets from release-assets.githubusercontent.com, and
        # the allowlist only ever named objects.githubusercontent.com. The two
        # names resolve to the same addresses today, but Cilium associates a
        # connection with the FQDN it was looked up under, so a host that is
        # never named is never permitted.
        #
        # Kept as two entries rather than one: they are separate names in
        # GitHub's CDN and either can be renamed independently.
        - matchName: objects.githubusercontent.com
        - matchName: release-assets.githubusercontent.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  podSelector: {}
  policyTypes: ["Egress"]