# Temporary GitOps recovery for the bootstrap-owned root Application. The live
# spire-route Application creates this after root was pruned while transitioning
# it out of its own recursive source. Remove this file once root has recreated
# the spire-policies child; the root itself excludes argocd/root-app.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  annotations:
    resources-finalizer.argocd.argoproj.io: "true"
spec:
  project: default
  source:
    repoURL: https://github.com/2143-Labs/timestone-argo
    targetRevision: HEAD
    path: argocd
    directory:
      recurse: true
      exclude: root-app.yaml
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
