# Routes for SPIRE components that must live in the namespace owning their
# backend Service.
#
# Why this is NOT in base/gateway/routes.yaml: Gateway API resolves a
# backendRef only within the HTTPRoute's own namespace, and the SPIRE chart
# (with global.spire.namespaces set) places the OIDC provider in
# `spire-server`. A route in `default` therefore cannot reach it: the
# ResolvedRefs condition goes to False with RefNotPermitted/InvalidKind and the
# route serves 502s. The Gateway's listener allowedRoutes selector names
# `spire-server` alongside `default` to let this attach.
#
# Deliberate exception to base/gateway/routes.yaml's "no gate ⇒ no route" rule:
# the SPIFFE OIDC discovery document and JWKS are public key material, and the
# consumer is a machine (OpenBao fetching the issuer's JWKS) that cannot present
# an oauth2-proxy session. Nothing here is user data and nothing is writable.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: spiffe-oidc
  namespace: spire-server
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: timestone-gateway
      namespace: default
  hostnames:
    - "spiffe.hero-rehab.xyz"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: spire-spiffe-oidc-discovery-provider
          port: 80
          weight: 1
