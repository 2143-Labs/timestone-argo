apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: spire
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    chart: spire
    repoURL: https://spiffe.github.io/helm-charts-hardened
    # appVersion 1.15.3. Wave 3 is retained for ordering only; nothing here
    # depends on the CNPG Cluster (wave 2) — the datastore is SQLite on a PVC.
    targetRevision: 0.30.2
    helm:
      releaseName: spire
      values: |
        global:
          # The chart ships kubectl jobs that patch the webhook's failurePolicy
          # around install/upgrade (pre-upgrade -> Ignore, post-* -> Fail).
          # ArgoCD renders with `helm template` and runs those helm.sh hooks as
          # Argo PreSync/PostSync hooks, which breaks their ordering assumption:
          # the pre-upgrade job patches default-spire-controller-manager-webhook
          # BEFORE the webhook exists on a first sync, so it errors with
          # NotFound and deadlocks the sync. The chart documents these as
          # "should be disabled when using helm template". Disabling leaves the
          # webhook at its steady-state failurePolicy: Fail, identical to a
          # clean `helm install` after its post-install hook.
          installAndUpgradeHooks:
            enabled: false
          deleteHooks:
            enabled: false
          spire:
            # Component placement. The release itself stays in `default`, which
            # is what keeps the controller-manager className "default-spire" —
            # base/spire/identities.yaml depends on that exact string. These
            # flags move the *pods*, not the release.
            #
            # Why this is required rather than cosmetic: Talos configures
            # KubeAdmissionControlConfig with enforce=baseline as the cluster
            # default, and namespace `default` inherits it. The agent needs
            # hostNetwork/hostPID/hostPort 9982 and the CSI driver is
            # privileged, so both are rejected there with FailedCreate. The
            # chart renders a Namespace per component with matching PodSecurity
            # labels (spire-system: privileged, spire-server: restricted), so
            # namespacePSS is what makes the admission check pass.
            #
            # recommendations.enabled also turns on strictMode, which fails the
            # render unless trustDomain, clusterName, jwtIssuer and caSubject
            # are all non-default. That is deliberate: it is what stops a
            # placeholder identity from being deployed silently.
            recommendations:
              enabled: true
              namespaceLayout: true
              namespacePSS: true
            namespaces:
              create: true
              system:
                name: spire-system
              server:
                name: spire-server
            # The timestone trust domain. NOT the hero-rehab production
            # cluster's `trust.hero.rehab`, which this value previously and
            # wrongly named, and NOT the DigitalOcean cluster's
            # `trust-do.2143.me`. Neither is ever a federation peer here.
            trustDomain: trust.hero-rehab.xyz
            clusterName: timestone
            # Pins the issuer for both the JWT-SVID `iss` claim and the OIDC
            # discovery document. Unset, the chart derives
            # https://oidc-discovery.<trustDomain>, which is NOT the endpoint
            # OpenBao is configured against.
            jwtIssuer: https://spiffe.hero-rehab.xyz
        spire-server:
          # The chart default (1) documents that multiple replicas "will not
          # work until we use an external database". The datastore below is
          # SQLite on a PVC, so one replica is the correct count, not a
          # compromise. Revisit only when entry or agent count makes SQLite the
          # constraint — that needs an external database AND a way to
          # distribute its credential into both namespaces, which this repo
          # does not have declaratively today.
          replicaCount: 1
          # No dataStore block: the chart default is SQLite at
          # /run/spire/data/datastore.sqlite3 with persistence.type pvc.
          # Chosen over the previous Postgres/CNPG datastore because with
          # components split across namespaces a Postgres password Secret is
          # needed in both CNPG's namespace and spire-server, and nothing here
          # can create secrets declaratively.
          #
          # Required by strict mode. This is the X.509 CA subject for the whole
          # trust domain: changing it re-roots every SVID issued here, so it is
          # fixed deliberately rather than defaulted.
          caSubject:
            country: DE
            organization: 2143 Labs
            commonName: trust.hero-rehab.xyz
          controllerManager:
            enabled: true
          federation:
            # Serves the bundle endpoint over HTTPS on the in-cluster Service
            # only. The rendered profile is https_spiffe while
            # federation.tls.spire.enabled is true (the default); switching to
            # https_web requires a serving certificate, which phase C does by
            # deploying cert-manager and setting federation.tls.certManager.
            enabled: true
            bundleEndpoint:
              port: 8443
              address: 0.0.0.0
        spire-agent:
          enabled: true
        spiffe-csi-driver:
          enabled: true
        spiffe-oidc-discovery-provider:
          enabled: true
          # Plain HTTP so the Cloudflare tunnel terminates TLS with a publicly
          # trusted certificate. All three tls.* switches are OR-ed, so this
          # only holds while tls.externalSecret and tls.certManager stay at
          # their false defaults. Plain mode listens on 8080 and the Service
          # exposes port 80 (name http).
          tls:
            spire:
              enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
