apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    chart: cilium
    repoURL: https://helm.cilium.io
    # Resolved 2026-09-12 from the helm.cilium.io index: chart 1.20.1 ships
    # Cilium v1.20.1 (supports Kubernetes 1.33-1.36; timestone runs 1.35.8).
    # Upgrades are separate follow-up commits, never "latest".
    targetRevision: 1.20.1
    helm:
      releaseName: cilium
      values: |
        cluster:
          name: timestone
          id: 1
        ipam:
          mode: kubernetes
        # Encapsulated routing, not native. With native routing plus
        # ipv4NativeRoutingCIDR, Cilium assumes the underlying network routes pod
        # CIDRs and deliberately does NOT install per-node routes for them.
        # Nothing does route them here: the Hetzner route for the pod CIDR would
        # have to be programmed by hcloud-ccm, and the CCM cannot (see the
        # golden-image blocker in the infra repo). The observed result was a
        # node routing table with only its own pod CIDR — `10.244.0.0/24 via
        # cilium_host` — so a pod could not reach a ClusterIP backed by another
        # node, which is what stalled ArgoCD's redis (dial tcp 10.96.0.1:443).
        # VXLAN encapsulates between node IPs, which the private network does
        # route, so pod traffic needs no cloud route programming at all.
        routingMode: tunnel
        # endpointRoutes stays absent: Cilium force-disables BPF host routing
        # whenever endpoint routes are enabled, and falls back to legacy host
        # routing. With kube-proxy replaced that leaves hostNetwork pods with no
        # path to any ClusterIP. BPF host routing requires bpf.masquerade, and
        # it works with tunneling as well as native routing.
        bpf:
          masquerade: true
        kubeProxyReplacement: true
        k8sServiceHost: localhost
        k8sServicePort: 7445
        encryption:
          enabled: true
          type: wireguard
        securityContext:
          capabilities:
            ciliumAgent: [CHOWN, KILL, NET_ADMIN, NET_RAW, IPC_LOCK, SYS_ADMIN, SYS_CHROOT, DAC_OVERRIDE, SETGID, SETUID]
            cleanCiliumState: [NET_ADMIN, SYS_ADMIN, SYS_CHROOT]
        cgroup:
          autoMount:
            enabled: false
          hostRoot: /sys/fs/cgroup
        hubble:
          enabled: false
        operator:
          replicas: 1
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true