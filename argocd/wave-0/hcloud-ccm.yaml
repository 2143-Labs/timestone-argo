apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hcloud-ccm
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  # Static manifests in base/hcloud-ccm (not the helm chart): ArgoCD's bundled
  # helm v4.2.1 fails to render the chart's deployment.yaml (YAML parse error at
  # line 63, triggered by ArgoCD's --api-versions list). Image pinned to the
  # chart 1.36.0 app version; reads the `hcloud` Secret (key token) created
  # imperatively at bootstrap.
  source:
    repoURL: https://github.com/2143-Labs/timestone-argo.git
    targetRevision: talos-cutover
    path: base/hcloud-ccm
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true