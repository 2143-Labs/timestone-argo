apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openbao-secret-sync
  namespace: argocd
  annotations:
    # Wave 4 (not 3): this pod mounts the SPIFFE CSI volume, so the agent and
    # CSI driver from the wave-3 spire Application must exist first, and the
    # spire-identities Application must have registered its SPIFFE ID.
    argocd.argoproj.io/sync-wave: "4"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/2143-Labs/timestone-argo.git
    targetRevision: HEAD
    path: base/apps/openbao-secret-sync
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
