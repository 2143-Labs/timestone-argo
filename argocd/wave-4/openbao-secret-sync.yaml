apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openbao-secret-sync
  namespace: argocd
  annotations:
    # Wave 4 (not 3): this pod mounts the SPIFFE CSI volume, so the agent and
    # CSI driver from the wave-3 spire Application must exist first, and the
    # spire-identities Application must have registered its SPIFFE ID.
    argocd.argoproj.io/sync-wave: "4"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/2143-Labs/timestone-argo.git
    targetRevision: HEAD
    # `workloads/`, not `base/`: the CI validator requires every manifest under
    # base/ to declare namespace `default`, and this workload must live in its
    # own namespace so the SPIFFE ID is not shared with anything else that can
    # create a pod in `default`.
    path: workloads/openbao-sync
  destination:
    server: https://kubernetes.default.svc
    namespace: openbao-sync
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The consumer Deployment references Secret `openbao-steam`, which nothing
      # in Git creates — it is written at runtime by the sync loop. Without this
      # the very first sync fails with CreateContainerConfigError on a missing
      # Secret and Argo marks the Application Degraded before the loop has had a
      # chance to run. This Application owns both halves (the sync pod and the
      # consumer) so there is no ordering between two Applications to express.
      - SkipDryRunOnMissingResource=true
